<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Списки ролей — Флуд</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#1a0408;color:#fff;min-height:100vh;padding:15px}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(1.1) saturate(1.3)}
.tint{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at center,rgba(220,38,38,.18),rgba(20,3,8,.58))}
.wrap{max-width:600px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border-radius:14px;border:1px solid rgba(251,113,133,.5);background:rgba(28,6,12,.85);color:#fecdd3;font-weight:700;font-size:14px;cursor:pointer;text-align:center;transition:.2s}
.tab.act{background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;border-color:#fda4af;box-shadow:0 0 16px rgba(225,29,72,.8)}
.head{text-align:center;background:rgba(28,6,12,.8);backdrop-filter:blur(7px);padding:16px;border-radius:16px;border:1px solid rgba(244,63,94,.65);box-shadow:0 0 22px rgba(225,29,72,.45);margin-bottom:14px}
h1{font-size:21px;margin:4px 0;text-shadow:0 0 12px #fb7185}
.leg{font-size:13px;color:#fecdd3;margin-top:6px}
.tip{font-size:12px;color:#fda4af;margin-top:6px}
input{width:100%;padding:12px 15px;border-radius:12px;border:1px solid #f43f5e;background:rgba(24,5,10,.9);color:#fff;font-size:15px;outline:none;margin-bottom:10px}
input:focus{box-shadow:0 0 14px #f43f5e}
.btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{flex:1;min-width:75px;padding:8px;border:none;border-radius:10px;background:rgba(38,8,16,.88);color:#fff;font-weight:600;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.18)}
.fbtn.act{background:#e11d48;border-color:#fda4af;box-shadow:0 0 12px rgba(225,29,72,.75)}
.grp{background:rgba(22,5,10,.8);backdrop-filter:blur(6px);border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid rgba(244,63,94,.28)}
.gt{font-size:14px;font-weight:700;color:#fda4af;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.08);margin-bottom:5px;font-size:14px;cursor:pointer}
.row:active{transform:scale(.98);background:rgba(244,63,94,.3)}
.st{font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
.z{background:rgba(244,63,94,.32);color:#fecdd3}
.s{background:rgba(34,197,94,.3);color:#86efac}
.b{background:rgba(148,163,184,.3);color:#e2e8f0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<img id="bg" src="https://postimg.cc" alt="">
<div class="tint"></div>
<div class="wrap">
<div class="tabs">
<div class="tab act" onclick="setFan('jjk',this)">Магическая битва</div>
<div class="tab" onclick="setFan('csm',this)">Человек-бензопила</div>
</div>
<div class="head">
<div>⭐⭐⭐⭐⭐⭐⭐⭐</div>
<h1 id="title">🤩ᴀгичᴇскᴀя ҕитвᴀ.</h1>
<div>⭐⭐⭐⭐⭐⭐⭐</div>
<div class="leg">свободен — 🟢 &nbsp;|&nbsp; занят — ♥️ &nbsp;|&nbsp; бронь — 🌑</div>
<div class="tip">💡 Нажми на персонажа, чтобы скопировать его имя</div>
</div>
<input id="q" placeholder="🔍 Найти персонажа..." oninput="render()">
<div class="btns">
<button class="fbtn act" onclick="setF('all',this)">Все</button>
<button class="fbtn" onclick="setF('s',this)">Свободен 🟢</button>
<button class="fbtn" onclick="setF('z',this)">Занят ♥️</button>
<button class="fbtn" onclick="setF('b',this)">Бронь 🌑</button>
</div>
<div id="list"></div>
</div>
<div id="toast">Скопировано!</div>
<script>
const db = {
jjk: {
title: "🤩ᴀгичᴇскᴀя ҕитвᴀ.",
bg: "https://postimg.cc",
data: [
["Токийская школа: Преподаватели",["Масамичи Яга|s","Сатору Годжо|s","Ацуя Кусакабэ|s","Киетака Иджичи|s","Секо Иейри|s","Акари Нитта|s"]],
["Токийская школа: 1 курс",["Итадори Юджи|z","Мегуми Фушигуро|z","Нобара Кугисаки|z"]],
["Токийская школа: 2 курс",["Маки Зенин|z","Тоге Инумаки|s","Панда|s","Юта Оккоцу|z"]],
["Токийская школа: 3 курс",["Киндзи Хакари|s","Кирара Хоши|s"]],
["Киотская школа: Преподаватели",["Ёсинобу Гакугандзи|s","Утахимэ Иори|s"]],
["Киотская школа: 1 курс",["Арата Нитта|s"]],
["Киотская школа: 2 курс",["Май Зенин|s","Кокичи Мута|s","Мива Касуми|s"]],
["Киотская школа: 3 курс",["Норитоши Камо|z","Аой Тодо|z","Момо Нисимия|s"]],
["Профессиональные колдуны",["Кенто Нанами|z","Такума Ино|z","Мей Мей|z","Мастер Тенген|s"]],
["Семья Зенин",["Наобито Зенин|s","Наоя Зенин|z","Оги Зенин|s","Ранта Зенин|s","Дзиничи Зенин|s","Чодзюро Зенин|s","Нобуаки Зенин|s"]],
["Проклятые духи",["Махито|z","Дзёго|s","Ханами|s","Дагон|s","Проклятая Рика|s","Кучисаке-Онна|s","Тамамоно-Мэ|s","Ганеша|s","Чосо|z","Эсу Кечидзу|s","Когай|s"]],
["Оригинальная группа Гето",["Сугуру Гето|z","Мимико Хасаба|s","Нанако Хасаба|s","Мигель|s"]],
["Оригинальная группа",["Кендзяку|z","Урауме|s","Дзюдзо Кумия|s","Харуто Сигемо|s"]],
["Остальные",["Тоджи Фушигуро|s","Шиу Конг|s","Сэцуко Сасаки|s","Такеши Игучи|s","Шота Ито|s","Цумики Фушигуро|s","Юко Одзава|s","Рика Оримото|s","Такада-тян|s","Рико Аманай|s","Мисато Курой|s","Сукуна Ремен|z","Юй Юй|s","Юки Тсукумо|z"]]
]
},
csm: {
title: "🤩ᴇᴧоʙᴇᴋ бᴇнзоᴨиᴧᴀ.",
bg: "https://postimg.cc",
data: [
["Четвертый особый дивизион",["Аки Хаякава|s","Пауэр|s","Капитан Кашибэ|z","Денджи|z","Принз|s","Демон Ангела|s","Химено|s","Фуши|s","Мадока|s","Хироказу Араи|s","Кобени Хигасияма|s","Бим|s","Галгали|s"]],
["Второй дивизион",["Фуруно|s","Номо|s","Като|s","Танабэ|s","Накамура|s","Кусакабэ|s","Тамаоки|s"]],
["Первый дивизион",["Субару|s","Ютаро Куросэ|s","Мичико Тендо|s","Мияги|s"]],
["Пятый особый дивизион",["Макима|z","Гуаньси|z","Человек-Катана|s","Резе|z"]],
["Частный сектор",["Хирофуми Ёсида|z","Аканэ Саватари|s","Толик|s","Алдо|s","Джоуи|s","Санта-Клаус|s"]],
["Демоны",["Йор|z","Космо|s","Лонг|s","Пинци|s","Цугихаги|s","Наюта|s","Ангел Демон|z","Бим|z","Галгали|s","Принз|s"]]
]
}
};
let fan = 'jjk', cur = 'all';
const map = {z:['z','♥️ Занят'],s:['s','🟢 Свободен'],b:['b','🌑 Бронь']};
function setFan(k,el){
fan=k;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
el.classList.add('act');
document.getElementById('title').textContent = db[k].title;
document.getElementById('bg').src = db[k].bg;
render();
}
function setF(f,el){cur=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('act'));el.classList.add('act');render();}
function cp(n){navigator.clipboard.writeText(n);const t=document.getElementById('toast');t.textContent='Скопировано: '+n;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function render(){
const v = document.getElementById('q').value.toLowerCase();
let h = '';
db[fan].data.forEach(g=>{
let rows = g[1].map(i=>i.split('|')).filter(x=>(cur==='all'||x[1]===cur)&&x[0].toLowerCase().includes(v));
if(rows.length){
h += `<div class="grp"><div class="gt">${g[0]}</div>` + rows.map(x=>`<div class="row" onclick="cp('${x[0]}')"><span>${x[0]}</span><span class="st ${map[x[1]][0]}">${map[x[1]][1]}</span></div>`).join('') + `</div>`;
}
});
document.getElementById('list').innerHTML = h || '<div class="grp" style="text-align:center">Никого не найдено</div>';
}
render();
</script>
</body>
</html>
